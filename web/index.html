<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="LiveTV - browse and watch live channels in the browser.">
  <meta name="theme-color" content="#0b0d12">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="LiveTV">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>LiveTV</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <style>
    #boot-loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: #0b0d12;
      color: #e6e8ee;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      z-index: 9999;
    }
    #boot-loading .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255, 255, 255, 0.15);
      border-top-color: #268BD2;
      border-radius: 50%;
      animation: boot-spin 0.8s linear infinite;
    }
    @keyframes boot-spin { to { transform: rotate(360deg); } }
  </style>
  <div id="boot-loading">
    <div class="spinner"></div>
    <div>Loading LiveTV…</div>
  </div>
  <script>
    (function () {
      var removed = false;
      function removeBootLoading() {
        if (removed) return;
        var el = document.getElementById('boot-loading');
        if (el) { el.remove(); removed = true; }
      }
      // Poll for Flutter's render and remove the overlay as soon as it appears.
      var poll = setInterval(function () {
        if (document.querySelector('flutter-view, canvas')) removeBootLoading();
        if (removed) clearInterval(poll);
      }, 100);
      // Safety net: always remove after 4s.
      setTimeout(function () { removeBootLoading(); clearInterval(poll); }, 4000);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
